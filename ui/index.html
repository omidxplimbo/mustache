<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Script Runner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            max-width: 400px;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="submit"] {
            padding: 10px;
            margin-bottom: 10px;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        #output {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
<h1>Script Runner</h1>
<form id="myForm">
    <input type="text" name="command" placeholder="Command">
    <input type="submit" value="Run">
</form>
<pre id="output"></pre>

<script>
    document.getElementById('myForm').addEventListener('submit', function(e) {
        e.preventDefault();

        var formData = new FormData(this);

        fetch('/run', {
            method: 'POST',
            body: formData
        })
            .then(response => response.text())
            .then(data => {
                document.getElementById('output').textContent = data;
            })
            .catch(error => {
                console.error('Error:', error);
            });
    });
</script>
</body>
</html>
